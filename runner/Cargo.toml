[package]
name = "gond-agent-worker"
version = "0.1.0"
edition = "2024"
description = "Internal autonomous container worker"
license = "UNLICENSED"
publish = false

[[bin]]
name = "gond-agent-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
