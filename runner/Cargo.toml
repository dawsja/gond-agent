[package]
name = "gond-agent-worker"
version = "0.1.0"
edition = "2024"
description = "Internal autonomous container worker"
license = "MIT"
publish = false

[[bin]]
name = "gond-agent-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
futures = "0.3"
globset = "0.4"
hmac = "0.12"
httpdate = "1"
sha2 = "0.10"
toml = "0.9"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time", "sync", "signal"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# Fake-clock lifecycle tests; no additional runtime dependencies.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
