# Copy .env.example to .env and set BETTER_AUTH_SECRET before starting.
# Install or update: docker compose pull && docker compose up -d
name: gond-agent
services:
  worker-image:
    image: ${GOND_AGENT_WORKER_IMAGE:-ghcr.io/dawsja/gond-agent-worker:main}
    # Include the worker in ordinary pulls without starting its control process.
    entrypoint: ["/usr/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  gond-agent:
    image: ${GOND_AGENT_IMAGE:-ghcr.io/dawsja/gond-agent:main}
    depends_on:
      worker-image:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8787"
      BIND_ADDRESS: "0.0.0.0"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:8787}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env using openssl rand -base64 32}"
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      GOND_AGENT_DATA_DIR: /data
      GH_CONFIG_DIR: /gh
      GOND_AGENT_REPOSITORIES: "${GOND_AGENT_REPOSITORIES:-}"
      GOND_AGENT_WORKER_IMAGE: "${GOND_AGENT_WORKER_IMAGE:-ghcr.io/dawsja/gond-agent-worker:main}"
      MAX_ACTIVE_RUNS: "${MAX_ACTIVE_RUNS:-5}"
      RUN_IDLE_MINUTES: "${RUN_IDLE_MINUTES:-30}"
      RUN_TURN_MINUTES: "${RUN_TURN_MINUTES:-60}"
      RUN_CPUS: "${RUN_CPUS:-2}"
      RUN_MEMORY_MB: "${RUN_MEMORY_MB:-2048}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: volume
        source: gond-agent-data
        target: /data
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    stop_grace_period: 30s

volumes:
  gond-agent-data:
