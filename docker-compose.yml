# Copy .env.example to .env and set BETTER_AUTH_SECRET before starting.
# Install or update: docker compose pull && docker compose up -d
name: gond-agent
services:
  worker-image:
    image: ${GOND_AGENT_WORKER_IMAGE:-ghcr.io/dawsja/gond-agent-worker:main}
    # Include the worker in ordinary pulls without starting its control process.
    entrypoint: ["/usr/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  gond-agent:
    image: ${GOND_AGENT_IMAGE:-ghcr.io/dawsja/gond-agent:main}
    depends_on:
      worker-image:
        condition: service_completed_successfully
        restart: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8787"
      BIND_ADDRESS: "0.0.0.0"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:8787}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env using openssl rand -base64 32}"
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      GOND_AGENT_DATA_DIR: /data
      GOND_AGENT_WORKER_IMAGE: "${GOND_AGENT_WORKER_IMAGE:-ghcr.io/dawsja/gond-agent-worker:main}"
      GOND_AGENT_COMMIT_NAME: "${GOND_AGENT_COMMIT_NAME:-}"
      GOND_AGENT_COMMIT_EMAIL: "${GOND_AGENT_COMMIT_EMAIL:-}"
      GOND_AGENT_PLAN_REMINDER_EVERY: "${GOND_AGENT_PLAN_REMINDER_EVERY:-6}"
      GOND_AGENT_QUESTION_WAIT_MINUTES: "${GOND_AGENT_QUESTION_WAIT_MINUTES:-240}"
      GOND_AGENT_WEB_SEARCH_LIMIT: "${GOND_AGENT_WEB_SEARCH_LIMIT:-30}"
      GOND_AGENT_PLAN_NUDGE_LIMIT: "${GOND_AGENT_PLAN_NUDGE_LIMIT:-2}"
      GOND_AGENT_EVIDENCE: "${GOND_AGENT_EVIDENCE:-on}"
      GOND_AGENT_REVIEW: "${GOND_AGENT_REVIEW:-on}"
      GOND_AGENT_EVIDENCE_REPO_POLICY: "${GOND_AGENT_EVIDENCE_REPO_POLICY:-}"
      # Leave fallback to the API's single default constant (unset forwards empty).
      GOND_AGENT_CI_FIX_ROUNDS: "${GOND_AGENT_CI_FIX_ROUNDS:-}"
      GOND_AGENT_CI_WAIT_MINUTES: "${GOND_AGENT_CI_WAIT_MINUTES:-20}"
      MODEL_STALL_MINUTES: "${MODEL_STALL_MINUTES:-10}"
      MAX_ACTIVE_RUNS: "${MAX_ACTIVE_RUNS:-5}"
      GOND_AGENT_QUEUE_MAX: "${GOND_AGENT_QUEUE_MAX:-50}"
      GOND_AGENT_QUEUE_MAX_PER_ACCOUNT: "${GOND_AGENT_QUEUE_MAX_PER_ACCOUNT:-10}"
      GOND_AGENT_QUEUE_WAIT_HOURS: "${GOND_AGENT_QUEUE_WAIT_HOURS:-24}"
      GOND_AGENT_FAILED_KEEP_MINUTES: "${GOND_AGENT_FAILED_KEEP_MINUTES:-60}"
      GOND_AGENT_AUTO_RESUME: "${GOND_AGENT_AUTO_RESUME:-1}"
      RUN_CPUS: "${RUN_CPUS:-2}"
      RUN_MEMORY_MB: "${RUN_MEMORY_MB:-2048}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: volume
        source: gond-agent-data
        target: /data
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    stop_grace_period: 30s

volumes:
  gond-agent-data:
